<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0e">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{--bg:#0b0b0e;--card:#15151a;--card2:#1e1e25;--card3:#26262f;--line:#2a2a34;--tx:#f3f3f6;--mut:#a3a3b1;--gold:#d9b44a;--gold2:#f2d684;--ok:#3ecf8e;--warn:#f5b942;--bad:#ff6b6b;--blue:#6aa8ff;--pink:#e88bd0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
main{max-width:560px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(100px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;flex-wrap:wrap}
h1{font-size:22px;margin:0;letter-spacing:-.3px}h1 span{color:var(--gold)}
.sub{color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.card h2{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--mut);margin:0 0 12px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.hero{background:linear-gradient(160deg,#1c1a12 0%,var(--card) 55%);border-color:#3a3320}
.big{font-size:42px;font-weight:800;letter-spacing:-1.5px;line-height:1.05}
.bar{height:10px;background:#09090c;border-radius:99px;overflow:hidden;margin:12px 0 6px}
.bar i{display:block;height:100%;border-radius:99px;transition:width .5s}
.bar.sm{height:7px;margin:6px 0}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini{background:var(--card2);border-radius:14px;padding:12px}
.mini b{display:block;font-size:22px;letter-spacing:-.5px;margin:2px 0}
.mini small{color:var(--mut);font-size:12px;display:block}
.light{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;font-size:14px;margin-top:12px}
.light .dot{width:12px;height:12px;border-radius:50%;flex:none}
.l-ok{background:rgba(62,207,142,.1)}.l-ok .dot{background:var(--ok)}
.l-warn{background:rgba(245,185,66,.12)}.l-warn .dot{background:var(--warn)}
.l-bad{background:rgba(255,107,107,.12)}.l-bad .dot{background:var(--bad)}
.alert{border-radius:14px;padding:12px 14px;font-size:14px;margin-bottom:12px;display:flex;gap:10px;align-items:flex-start}
.alert svg{width:18px;height:18px;flex:none;margin-top:1px}
.a-bad{background:rgba(255,107,107,.12);color:#ffc4c4}
.a-warn{background:rgba(245,185,66,.12);color:var(--gold2)}
.a-ok{background:rgba(62,207,142,.1);color:#a9f0d0}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.qbtn{border-radius:18px;padding:16px 14px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;min-height:92px}
.qbtn .ic{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.qbtn .ic svg{width:20px;height:20px}
.qbtn b{font-size:15px}.qbtn small{color:var(--mut);font-size:12px;margin-top:-6px}
.qbtn.me .ic{background:var(--gold);color:#1a1405}
.qbtn.shop .ic{background:rgba(106,168,255,.18);color:var(--blue)}
.qbtn:active{transform:scale(.98)}
.btn{border:1px solid var(--line);background:var(--card2);border-radius:14px;padding:12px 16px;font-size:15px;font-weight:650;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1a1405}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#06142a}
.btn.ghost{background:none}
.btn.full{width:100%}
.btn.sm{padding:8px 13px;min-height:38px;font-size:13px;border-radius:11px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.4}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(11,11,14,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs .in{display:flex;width:100%;max-width:560px}
nav.tabs button{flex:1;min-width:0;background:none;border:0;color:var(--mut);padding:10px 0 9px;font-size:10.5px;font-weight:650;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:56px}
nav.tabs button svg{width:23px;height:23px}
nav.tabs button.on{color:var(--gold)}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;gap:10px}
.row:last-child{border-bottom:0}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;white-space:nowrap}
.grow{flex:1;min-width:0}.grow small{display:block;color:var(--mut);font-size:12px}
.x{background:none;border:0;color:var(--mut);font-size:13px;padding:8px;min-width:40px;min-height:40px}
.x.confirm{color:var(--bad);font-weight:700}
.bars{display:flex;align-items:flex-end;gap:8px;height:140px;padding-top:8px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;font-size:11px;color:var(--mut)}
.bars i{display:block;width:100%;border-radius:8px 8px 3px 3px;min-height:3px}
.bars b{color:var(--tx);font-size:11px;white-space:nowrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card2);border-radius:99px;padding:8px 14px;font-size:14px;min-height:38px;white-space:nowrap;flex:none}
.chip.on{background:var(--gold);color:#1a1405;border-color:var(--gold);font-weight:700}
label{display:grid;gap:6px;font-size:13px;color:var(--mut);margin-bottom:12px}
input,select{width:100%;background:#09090c;border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:12px;font-size:16px;font-family:inherit}
input:focus,select:focus{outline:2px solid var(--gold);border-color:transparent}
input.amount{font-size:30px;font-weight:800;text-align:center}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center;z-index:10;animation:fade .15s}
.sheet .box{background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;width:100%;max-width:560px;padding:10px 16px calc(16px + env(safe-area-inset-bottom));max-height:94vh;overflow:auto;animation:up .2s ease-out}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--card3);margin:0 auto 12px}
.sheet h3{margin:0 0 12px;font-size:18px}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card2);border-radius:14px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{border:0;background:none;border-radius:11px;padding:10px;font-weight:700;color:var(--mut);min-height:42px}
.seg button.on.me{background:var(--gold);color:#1a1405}
.seg button.on.shop{background:var(--blue);color:#06142a}
.display{text-align:center;font-size:48px;font-weight:800;letter-spacing:-1.5px;padding:6px 0 2px;min-height:68px}
.display small{font-size:22px;color:var(--mut);font-weight:700;margin-right:6px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 12px}
.keys button{border:0;background:var(--card2);border-radius:14px;font-size:24px;font-weight:600;min-height:56px}
.keys button:active{background:var(--card3)}
.goal{display:grid;grid-template-columns:84px 1fr;gap:12px;align-items:center}
.goal .img{width:84px;height:84px;border-radius:16px;background:var(--card2) center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:11px;text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:#000;border:1px solid var(--line);padding:11px 18px;border-radius:99px;font-size:14px;z-index:20;max-width:92vw;text-align:center;animation:up .2s}
.empty{color:var(--mut);font-size:14px;text-align:center;padding:12px 0}
.tip{font-size:14px;color:#dcdce4;margin:7px 0;line-height:1.5}
.tip b{color:var(--gold2)}
.month{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px}
.month button{width:34px;height:34px;border-radius:50%;border:0;background:var(--card2);font-size:16px}
.month span{font-size:13px;font-weight:650;min-width:96px;text-align:center}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--mut);display:flex;align-items:center;justify-content:center;padding:0}
.iconbtn svg{width:20px;height:20px}
.drow{background:var(--card2);border-radius:14px;padding:11px 13px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.drow:last-child{margin-bottom:0}
.drow small{display:block;color:var(--mut);font-size:12px}
.gold{color:var(--gold2)}.okc{color:var(--ok)}.badc{color:var(--bad)}.bluec{color:var(--blue)}
.pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap}
.p-ok{background:rgba(62,207,142,.15);color:var(--ok)}.p-warn{background:rgba(245,185,66,.16);color:var(--warn)}.p-bad{background:rgba(255,107,107,.15);color:var(--bad)}.p-mut{background:var(--card2);color:var(--mut)}
.diag{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.45}
.diag:last-child{border-bottom:0}
.diag .dot{width:10px;height:10px;border-radius:50%;flex:none;margin-top:6px}
.d-ok{background:var(--ok)}.d-warn{background:var(--warn)}.d-bad{background:var(--bad)}
.check{display:flex;flex-direction:row;align-items:center;gap:12px;color:var(--tx);font-size:14px;margin:0;padding:10px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.check input{width:22px;height:22px;flex:none;accent-color:var(--gold);padding:0}
details.card summary{font-weight:700;font-size:15px;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:28px}
details.card summary::after{content:'+';color:var(--gold);font-size:20px}
details[open].card summary::after{content:'−'}
details.card summary::-webkit-details-marker{display:none}
details.card[open] summary{margin-bottom:6px}
.frow{display:grid;grid-template-columns:1.5fr 1fr .9fr 1fr auto;gap:6px;align-items:end}
.frow label{margin-bottom:8px;font-size:11px}
.frow input,.frow select{padding:10px 8px;font-size:15px}
.score{display:flex;align-items:center;gap:16px}
.score svg{width:104px;height:104px;flex:none}
.prio{background:linear-gradient(160deg,#2a1a1a,var(--card));border-color:#4a2a2a}
.prio.ok{background:linear-gradient(160deg,#15281f,var(--card));border-color:#22432f}
.nextpay{display:flex;align-items:center;gap:12px}
.nextpay .cal{width:54px;height:58px;border-radius:14px;background:var(--card2);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.nextpay .cal b{font-size:22px;line-height:1}.nextpay .cal small{font-size:10px;color:var(--gold);text-transform:uppercase;font-weight:800;letter-spacing:.5px}
.pig{display:flex;align-items:center;justify-content:space-between;gap:10px}
.toggle{position:relative;width:50px;height:30px;flex:none}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.toggle span{position:absolute;inset:0;background:var(--card3);border-radius:99px;transition:.2s}
.toggle span:before{content:'';position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.toggle input:checked+span{background:var(--gold)}
.toggle input:checked+span:before{transform:translateX(20px)}
.deb{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px}
.deb.venc{border-color:#5a2a2a}
.deb .top{display:flex;gap:12px;align-items:center}
.ava{width:44px;height:44px;border-radius:50%;background:var(--card3);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:var(--gold2);flex:none}
.deb .saldo{font-size:22px;font-weight:800;letter-spacing:-.5px;text-align:right}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.btn.wa{background:#1f9d55;border-color:#1f9d55;color:#fff}
a.btn{text-decoration:none;color:inherit}
.hint{font-size:12px;color:var(--mut);text-align:center;margin-top:-4px}
</style>
</head>

<script>
(function(){
'use strict';
var KEY='finanzas-elite-personal-v1';
var CATS=[
  {id:'Comida',color:'#e9b949',tip:'Lleva algo de casa o ponte un tope diario para comer fuera.'},
  {id:'Pasajes',color:'#6aa8ff',tip:'Junta tus salidas para hacer menos viajes en el día.'},
  {id:'Salidas',color:'#e88bd0',tip:'Ponles un tope por semana y decide el plan antes de salir.'},
  {id:'Compras',color:'#ff9f5a',tip:'Usa la lista de deseos: espera 24 horas antes de comprar.'},
  {id:'Otros',color:'#a3a3b1',tip:'Ponle tipo a algunos gastos para saber en qué se te va la plata.'}
];
var SIN={id:'Sin tipo',color:'#7d7d8c',tip:'Cuando puedas, ponle tipo a tus gastos. Así el análisis te dice dónde recortar.'};
var CATS_T=[{id:'Herramientas',color:'#6aa8ff'},{id:'Publicidad',color:'#e88bd0'},{id:'Reposición',color:'#ff9f5a'},{id:'Comisiones',color:'#e9b949'},{id:'Otros',color:'#a3a3b1'}];
var MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var DIAS=['Do','Lu','Ma','Mi','Ju','Vi','Sá'];

/* ================= DATOS ================= */
function seed(){
  return {v:2,sueldo:500,umbral:50,gastos:[
    {id:'s1',d:'2026-11-01',m:15,c:'',n:''},{id:'s2',d:'2026-11-04',m:69,c:'',n:''},
    {id:'s3',d:'2026-11-04',m:5,c:'',n:''},{id:'s4',d:'2026-11-04',m:40,c:'',n:''}],deseos:[],metas:[]};
}
var S;
try{S=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){S=null;}
if(!S||!S.v)S=seed();
function ensure(){
  if(!S.deseos)S.deseos=[];if(!S.metas)S.metas=[];if(!S.checks)S.checks={};
  if(!S.tienda)S.tienda={tc:6.96,split:{emergencia:30,reinversion:30,capital:40},capital:0,fijos:[],meses:{},gastos:[]};
  var T=S.tienda;if(!T.fijos.length)T.fijos=[{id:'f1',n:'Claude Pro',m:20,cur:'USD',dia:2},{id:'f2',n:'Railway',m:5,cur:'USD',dia:'fin'}];
  if(S.v<2){
    T.fijos.forEach(function(f){if(f.id==='f1'&&f.dia===1)f.dia=2;if(f.id==='f2'&&f.dia===1)f.dia='fin';});
    S.gastos.forEach(function(g){if(/^s[1-4]$/.test(g.id)&&g.c==='Otros')g.c='';});
    S.v=2;
  }
  Object.keys(T.meses).forEach(function(k){var m=T.meses[k];if(m.neta===undefined&&m.bruta!=null){m.neta=m.bruta;m.incluye=false;}if(!m.pagados)m.pagados={};
    Object.keys(m.pagados).forEach(function(id){if(m.pagados[id]===true)m.pagados[id]={bs:null};if(m.pagados[id]===false)delete m.pagados[id];});});
  if(!S.ahorro)S.ahorro={diario:5,redondeo:true,movs:[],feriados:{}};
  if(!S.deudores)S.deudores=[];
}
ensure();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('No se pudo guardar');}}

/* ================= UTILIDADES ================= */
function pad(n){return String(n).padStart(2,'0');}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function mk(d){return d.getFullYear()+'-'+pad(d.getMonth()+1);}
function now(){return new Date();}
function today(){return ymd(now());}
function toDate(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]||1);}
function addDays(s,n){var d=toDate(s);d.setDate(d.getDate()+n);return ymd(d);}
function daysIn(k){var p=k.split('-').map(Number);return new Date(p[0],p[1],0).getDate();}
function shift(k,n){var p=k.split('-').map(Number);return mk(new Date(p[0],p[1]-1+n,1));}
function mName(k){var p=k.split('-');return MESES[+p[1]-1]+' '+p[0];}
function mShort(k){return MESES[+k.slice(5,7)-1];}
function num(v){var n=parseFloat(String(v==null?'':v).replace(',','.'));return isFinite(n)?n:0;}
function bs(n,dec){var neg=n<0;n=Math.abs(n);var s=(dec===false||Math.abs(n-Math.round(n))<0.005)?String(Math.round(n)):n.toFixed(2).replace('.',',');s=s.replace(/\B(?=(\d{3})+(?!\d))/g,'.');return (neg?'−':'')+'Bs '+s;}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function cat(id){if(!id)return SIN;for(var i=0;i<CATS.length;i++)if(CATS[i].id===id)return CATS[i];return SIN;}
function total(a){return a.reduce(function(t,g){return t+num(g.m);},0);}
function gastosDe(k){return S.gastos.filter(function(g){return g.d.slice(0,7)===k;});}
function firstMonth(){var m=null;S.gastos.forEach(function(g){var k=g.d.slice(0,7);if(!m||k<m)m=k;});return m;}
function fechaCorta(s){return +s.slice(8)+' '+MESES[+s.slice(5,7)-1].slice(0,3);}
function esHabil(s){var w=toDate(s).getDay();return w>=1&&w<=5&&!S.ahorro.feriados[s];}

/* ================= PERSONAL ================= */
var memoPres={};
function presupuesto(k){
  var f=firstMonth();if(!f||k<=f)return num(S.sueldo);
  if(memoPres[k]!=null)return memoPres[k];
  var prev=shift(k,-1),pb=presupuesto(prev),pu=total(gastosDe(prev))+apartadoDe(prev);
  return (memoPres[k]=num(S.sueldo)-Math.max(0,pu-pb));
}
function apartadoDe(k){return S.ahorro.movs.filter(function(m){return m.d.slice(0,7)===k&&(m.t==='sobrante'||m.t==='redondeo');}).reduce(function(t,m){return t+num(m.m);},0);}
function estado(k){
  memoPres={};
  var hoy=today(),D=daysIn(k),actual=(k===hoy.slice(0,7));
  var d=actual?+hoy.slice(8):(k<hoy.slice(0,7)?D:1);
  var gs=gastosDe(k),gastado=total(gs),apartado=apartadoDe(k),usado=gastado+apartado,pres=presupuesto(k);
  var deHoy=actual?total(gs.filter(function(g){return g.d===hoy;}))+S.ahorro.movs.filter(function(m){return m.d===hoy&&(m.t==='sobrante'||m.t==='redondeo');}).reduce(function(t,m){return t+num(m.m);},0):0;
  var antes=usado-deHoy,diasRest=D-d+1,base=pres/D;
  var diario=Math.max(0,(pres-antes)/diasRest),hoyPuedes=diario-deHoy;
  var diasManana=D-d,manana=diasManana>0?Math.max(0,pres-usado)/diasManana:0;
  var dow=new Date(+k.slice(0,4),+k.slice(5,7)-1,d).getDay(),hastaDom=dow===0?1:(8-dow),diasSemana=Math.min(hastaDom,diasRest);
  var semana=Math.max(hoyPuedes,0)+(diasSemana-1)*manana;
  var ideal=pres*d/D,exceso=usado-ideal;
  var luz=usado>pres?'bad':(usado<=ideal?'ok':(usado<=ideal*1.15?'warn':'bad'));

function racha(){
  var n=0,d=addDays(today(),-1),f=firstMonth();if(!f)return 0;

/* ================= TIENDA ================= */
function diaPago(f,k){return f.dia==='fin'?daysIn(k):Math.min(Math.max(1,num(f.dia)||1),daysIn(k));}
function tcDe(f){return num(f.tc)||num(S.tienda.tc)||6.96;}
function estimado(f){return f.cur==='USD'?num(f.m)*tcDe(f):num(f.m);}
function mesT(k){var T=S.tienda;if(!T.meses[k])T.meses[k]={neta:null,incluye:false,pagados:{}};return T.meses[k];}
function costoFijo(f,k){var p=((S.tienda.meses[k]||{}).pagados||{})[f.id];return p&&p.bs!=null?num(p.bs):estimado(f);}
function tienda(k){
  memoPres={};
  var T=S.tienda,m=T.meses[k]||{neta:null,incluye:false,pagados:{}};
  var gt=T.gastos.filter(function(g){return g.d.slice(0,7)===k;});
  var fijos=T.fijos.reduce(function(t,f){return t+costoFijo(f,k);},0),varios=total(gt);
  var tiene=m.neta!==null&&m.neta!==undefined&&m.neta!=='';
  var panel=tiene?num(m.neta):0,neta=panel-(m.incluye?0:fijos)-varios,sueldo=num(S.sueldo);
  var resto=Math.max(0,neta-sueldo),meta=3*(fijos+sueldo),capital=num(T.capital),llena=capital>=meta;
  var pe=num(T.split.emergencia),pr=num(T.split.reinversion),pc=num(T.split.capital);if(llena){pc+=pe;pe=0;}var tot=pe+pr+pc||1;
  return {k:k,tiene:tiene,panel:panel,incluye:!!m.incluye,fijos:fijos,varios:varios,gt:gt,neta:neta,sueldo:sueldo,resto:resto,
    emergencia:resto*pe/tot,reinversion:resto*pr/tot,aCapital:resto*pc/tot,llena:llena,metaEmerg:meta,capital:capital,
    meses:(fijos+sueldo)>0?capital/(fijos+sueldo):0,pagados:m.pagados||{},rSueldo:neta>0?sueldo/neta*100:null,rFijos:(panel+(m.incluye?fijos:0))>0?fijos/(panel+(m.incluye?fijos:0))*100:null};
}
function pagosProximos(dias){
  var hoy=today(),k=hoy.slice(0,7),out=[];
  [k,shift(k,1)].forEach(function(mm){
    S.tienda.fijos.forEach(function(f){
      var pg=((S.tienda.meses[mm]||{}).pagados||{})[f.id];if(pg)return;
      var fecha=mm+'-'+pad(diaPago(f,mm));
      var dd=Math.round((toDate(fecha)-toDate(hoy))/86400000);
      if(mm===k&&dd<0)out.push({f:f,k:mm,fecha:fecha,dd:dd});
      else if(dd>=0&&dd<=dias)out.push({f:f,k:mm,fecha:fecha,dd:dd});
    });
  });
  return out.sort(function(a,b){return a.dd-b.dd;});
}
function proximoPago(){
  var hoy=today(),k=hoy.slice(0,7),best=null;
  [k,shift(k,1)].forEach(function(mm){S.tienda.fijos.forEach(function(f){
    if(((S.tienda.meses[mm]||{}).pagados||{})[f.id])return;
    var fecha=mm+'-'+pad(diaPago(f,mm));if(fecha<hoy&&mm!==k)return;
    if(!best||fecha<best.fecha)best={f:f,k:mm,fecha:fecha};});});
  return best;
}
function txtPago(x){

  if(x.dd<0)return '¿Ya pagaste '+n+'? Se cobraba el '+fechaCorta(x.fecha)+'. Márcalo en Tienda.';
  return (x.dd===0?'Hoy se cobra ':x.dd===1?'Mañana se cobra ':'En '+x.dd+' días se cobra ')+n+'. Que salga de la cuenta de la tienda.';
}

  var dows=[0,0,0,0,0,0,0];e.gs.forEach(function(g){dows[toDate(g.d).getDay()]+=num(g.m);});
  var mx=Math.max.apply(null,dows);if(e.gastado>0&&mx/e.gastado>=0.4&&e.gs.length>=4){var dn=['domingos','lunes','martes','miércoles','jueves','viernes','sábados'][dows.indexOf(mx)];out.push(['warn','El '+Math.round(mx/e.gastado*100)+'% de lo que gastas cae en '+dn+'. Planifica ese día antes de salir.']);}
  pagosProximos(3).forEach(function(x){out.push([x.dd<0?'warn':'bad',txtPago(x)]);});

  else{

  // ahorro
  var hh=habilesMes(k,today()),sv=S.ahorro.movs.filter(function(m){return m.t==='diario'&&m.d.slice(0,7)===k;}).length;
  if(hh>=3&&sv/hh<0.5)out.push(['warn','Este mes guardaste '+sv+' de '+hh+' días hábiles. Guarda los '+bs(num(S.ahorro.diario))+' apenas recibes el efectivo, antes de gastar.']);
  else if(sv>=3)out.push(['ok','Llevas '+sv+' días guardando este mes. En un año eso son '+bs(num(S.ahorro.diario)*240,false)+'.']);
  var ok3=[1,2,3].every(function(i){var x=tienda(shift(k,-i));return x.tiene&&x.neta>x.sueldo*1.7;});
  if(ok3)out.push(['ok','3 meses seguidos con ganancia de sobra. Puedes subirte el sueldo un 10%, a '+bs(Math.round(num(S.sueldo)*1.1))+'.']);

  var order={bad:0,warn:1,ok:2};return out.sort(function(a,b){return order[a[0]]-order[b[0]];});
}

function vAnalisis(){

  h+='</div><div class="sub" style="margin-top:8px">Lo ideal: unos '+bs(ideal,false)+' por semana. En rojo, las semanas que te pasaste.</div></div>';
  // día de la semana
  var dw=[0,0,0,0,0,0,0];e.gs.forEach(function(g){dw[toDate(g.d).getDay()]+=num(g.m);});
  var ord=[1,2,3,4,5,6,0],mx2=Math.max.apply(null,dw.concat([1]));
  h+='<div class="card"><h2>Por día de la semana</h2><div class="bars" style="height:110px">';
  ord.forEach(function(j){h+='<div><b>'+(dw[j]?Math.round(dw[j]):'')+'</b><i style="height:'+(dw[j]/mx2*100)+'%;background:'+(j===0||j===6?'var(--pink)':'var(--blue)')+';opacity:'+(dw[j]?1:.25)+'"></i>'+DIAS[j]+'</div>';});
  h+='</div></div>';
  // por tipo
  var por={};e.gs.forEach(function(g){var c=cat(g.c).id;por[c]=(por[c]||0)+num(g.m);});
  var lista=CATS.concat([SIN]).map(function(c){return {c:c,v:por[c.id]||0};}).filter(function(x){return x.v>0;}).sort(function(a,b){return b.v-a.v;});
  h+='<div class="card"><h2>Por tipo</h2>';
  lista.forEach(function(x){var p=x.v/e.gastado*100;h+='<div style="margin:8px 0"><div style="display:flex;justify-content:space-between;font-size:14px"><span>'+x.c.id+'</span><span><b>'+bs(x.v)+'</b> <span class="sub">'+Math.round(p)+'%</span></span></div><div class="bar sm"><i style="width:'+p+'%;background:'+x.c.color+'"></i></div></div>';});
  var top=lista[0];h+=alertBox('a-warn','Donde más se te va: <b>'+top.c.id+'</b> ('+Math.round(top.v/e.gastado*100)+'%). '+top.c.tip);
  h+='</div>';
  // comparación
  var prev=shift(ui.mes,-1),pg=gastosDe(prev);

  else{var hasta=total(pg.filter(function(g){return +g.d.slice(8)<=e.d;})),dif=e.gastado-hasta,pct=hasta?dif/hasta*100:0;
    h+='<div class="duo"><div class="mini"><small>'+mShort(prev)+' al día '+e.d+'</small><b>'+bs(hasta,false)+'</b></div><div class="mini"><small>'+mShort(ui.mes)+' al día '+e.d+'</small><b>'+bs(e.gastado,false)+'</b></div></div>';
    h+=alertBox(dif>0?'a-bad':'a-ok',dif>0?'Vas gastando <b>'+bs(dif,false)+' más</b> que el mes pasado'+(hasta?' ('+Math.round(pct)+'%)':'')+'.':'Vas gastando <b>'+bs(-dif,false)+' menos</b> que el mes pasado. ¡Bien!');

  h+='</div>';

  e.gs.slice().sort(function(a,b){return a.d<b.d?1:a.d>b.d?-1:0;}).forEach(function(g){h+=gastoRow(g,true);});
  h+='</div>';
  return h;

function pagadoD(x){return (x.pagos||[]).reduce(function(t,p){return t+num(p.m);},0);}
function saldoD(x){return Math.max(0,Math.round((num(x.monto)-pagadoD(x))*100)/100);}
function diasD(x){if(!x.vence)return null;return Math.round((toDate(x.vence)-toDate(today()))/86400000);}
function telWa(t){var d=String(t||'').replace(/\D/g,'');if(!d)return '';if(d.length===8)d='591'+d;return d;}
function waLink(x,gracias){

}

  if(s==='cobro'){
    var dx=find(S.deudores,f.id),sd=saldoD(dx),via=f.via||(dx.forma==='qr'?'qr':'efectivo');
    h+='<h3>'+(f.todo?esc(dx.n)+' pagó todo':'Abono de '+esc(dx.n))+'</h3><form id="form-cobro"><div class="sub" style="margin-bottom:10px">Te debe '+bs(sd)+'</div>';
    h+='<label>Monto (Bs)<input class="amount" id="co-m" inputmode="decimal" required value="'+(f.todo?sd:'')+'"'+(f.todo?' readonly':'')+'></label>';
    h+='<div style="font-size:13px;color:var(--mut);margin-bottom:6px">¿Cómo te pagó?</div><div class="seg"><button type="button" data-a="viaD" data-v="qr" class="'+(via==='qr'?'on shop':'')+'">QR</button><button type="button" data-a="viaD" data-v="efectivo" class="'+(via==='efectivo'?'on me':'')+'">Efectivo</button></div>';
    h+='<div class="duo"><button type="button" class="btn" data-a="cerrar">Cancelar</button><button class="btn gold">Registrar pago</button></div></form>';
  }
  if(s==='capital')h+='<h3>Saldo del capital</h3><form id="form-capital"><label>¿Cuánto hay hoy en la cuenta del capital? (Bs)<input class="amount" id="c-m" inputmode="decimal" value="'+esc(S.tienda.capital||'')+'" required></label><div class="duo"><button type="button" class="btn" data-a="cerrar">Cancelar</button><button class="btn gold">Guardar</button></div></form>';
  if(s==='deseo')h+='<h3>Algo que quiero</h3><form id="form-deseo"><label>¿Qué es?<input id="d-n" required placeholder="Ej: audífonos" value="'+esc(f.n||'')+'"></label><label>Precio (Bs)<input id="d-p" inputmode="decimal" required value="'+(f.p||'')+'"></label><div class="duo"><button type="button" class="btn" data-a="cerrar">Cancelar</button><button class="btn gold">Anotar</button></div></form>';
  if(s==='meta')h+='<h3>Nueva meta</h3><form id="form-meta"><label>¿Qué quieres lograr?<input id="m-n" required placeholder="Ej: celular nuevo"></label><label>Monto (Bs)<input id="m-o" inputmode="decimal" required></label><label>¿Para cuándo?<input id="m-f" type="date"></label><label>Foto (opcional)<input id="m-i" type="file" accept="image/*"></label><div class="duo"><button type="button" class="btn" data-a="cerrar">Cancelar</button><button class="btn gold">Crear</button></div></form>';
  if(s==='abonar'){var al=alcancia();h+='<h3>Abonar a la meta</h3><form id="form-abono"><label>Monto (Bs)<input class="amount" id="a-m" inputmode="decimal" value="'+(al>0?Math.floor(al):'')+'" required></label><div class="pig" style="margin-bottom:14px"><span style="font-size:14px">Sacarlo de la alcancía ('+bs(al)+')</span><label class="toggle" style="margin:0"><input type="checkbox" id="a-al"'+(al>0?' checked':'')+'><span></span></label></div><div class="duo"><button type="button" class="btn" data-a="cerrar">Cancelar</button><button class="btn gold">Abonar</button></div></form>';}
  h+='</div></div>';
  layer.innerHTML=h;
  if(s!=='gasto'){var first=layer.querySelector('input:not([type=date]):not([type=file]):not([type=checkbox])');if(first)setTimeout(function(){first.focus();first.select&&first.select();},60);}
}
function refreshGasto(){var n=document.getElementById('g-n'),d=document.getElementById('g-d');if(n)ui.form.n=n.value;if(d)ui.form.d=d.value;renderSheet();}

function toast(t){var o=document.querySelector('.toast');if(o)o.remove();var el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(function(){el.remove();},2400);}
function resizeImage(file,cb){var r=new FileReader();r.onload=function(){var img=new Image();img.onload=function(){var s=Math.min(1,360/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.75));};img.onerror=function(){cb('');};img.src=r.result;};r.onerror=function(){cb('');};r.readAsDataURL(file);}
function leerFijos(){document.querySelectorAll('.frow').forEach(function(r){var f=S.tienda.fijos[+r.getAttribute('data-fi')];if(!f)return;r.querySelectorAll('[data-ff]').forEach(function(inp){var k=inp.getAttribute('data-ff'),v=inp.value.trim();if(k==='m')f.m=num(v);else if(k==='dia')f.dia=/^f/i.test(v)?'fin':Math.min(31,Math.max(1,Math.round(num(v))||1));else f[k]=v;});});}
function leerDeudor(){var g=function(i){var e=document.getElementById(i);return e?e.value.trim():undefined;};var F=ui.form,v;
  if((v=g('dd-n'))!==undefined)F.n=v;if((v=g('dd-t'))!==undefined)F.tel=v;if((v=g('dd-m'))!==undefined)F.motivo=v;if((v=g('dd-v'))!==undefined)F.monto=v;if((v=g('dd-f'))!==undefined)F.vence=v;if((v=g('dd-x'))!==undefined)F.nota=v;}
function find(arr,id){return arr.filter(function(x){return x.id===id;})[0];}

/* ================= EVENTOS ================= */
layer.addEventListener('click',function(ev){if(ev.target.classList.contains('sheet')){ui.sheet=null;renderSheet();}});
document.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-a]');if(!b||b.disabled)return;
  var a=b.getAttribute('data-a'),id=b.getAttribute('data-id'),f=ui.form;
  if(['del','delT','delmeta','delAh','reset','delD','delPago'].indexOf(a)<0)ui.confirm=null;
  switch(a){
    case 'tab':ui.tab=b.getAttribute('data-t');ui.sheet=null;if(ui.tab!=='ajustes')ui.mes=ui.tab==='ahorro'||ui.tab==='asesor'?mk(now()):ui.mes;window.scrollTo(0,0);render();break;
    case 'mes':ui.mes=shift(ui.mes,+b.getAttribute('data-n'));render();break;
    case 'nuevo':ui.sheet='gasto';ui.form={w:b.getAttribute('data-w')||'me',v:'',c:'',n:'',d:ui.mes===today().slice(0,7)?today():ui.mes+'-01'};renderSheet();break;
    case 'who':f.w=b.getAttribute('data-w');f.c='';refreshGasto();break;
    case 'key':var k=b.getAttribute('data-k'),v=f.v||'';
      if(k==='⌫')v=v.slice(0,-1);else if(k==='.'){if(v.indexOf('.')<0)v=(v||'0')+'.';}else{if(/\.\d\d$/.test(v)||v.replace('.','').length>=7)break;v=(v==='0'?'':v)+k;}
      f.v=v;refreshGasto();break;
    case 'quickv':f.v=String(b.getAttribute('data-v'));refreshGasto();break;
    case 'cat':f.c=f.c===b.getAttribute('data-c')?'':b.getAttribute('data-c');refreshGasto();break;
    case 'saveGasto':var m=num(f.v);if(m<=0)break;var n=(document.getElementById('g-n').value||'').trim(),d=document.getElementById('g-d').value||today();
      if(f.w==='shop'){S.tienda.gastos.push({id:uid(),d:d,m:m,c:f.c||'',n:n});toast('Gasto de la tienda: '+bs(m));}
      else{S.gastos.push({id:uid(),d:d,m:m,c:f.c||'',n:n});var e2=estado(d.slice(0,7));toast(e2.actual?'Anotado. Hoy te quedan '+bs(Math.max(e2.hoyPuedes,0)):'Gasto anotado');}
      save();ui.sheet=null;render();break;
    case 'aDeseos':ui.form={n:(document.getElementById('g-n').value||'').trim(),p:num(f.v)};ui.sheet='deseo';renderSheet();break;
    case 'cerrar':ui.sheet=null;renderSheet();break;
    case 'del':if(ui.confirm===id){S.gastos=S.gastos.filter(function(g){return g.id!==id;});ui.confirm=null;save();}else ui.confirm=id;render();break;
    case 'delT':if(ui.confirm===id){S.tienda.gastos=S.tienda.gastos.filter(function(g){return g.id!==id;});ui.confirm=null;save();}else ui.confirm=id;render();break;
    case 'delAh':if(ui.confirm===id){S.ahorro.movs=S.ahorro.movs.filter(function(g){return g.id!==id;});ui.confirm=null;save();}else ui.confirm=id;render();break;
    case 'pagar':ui.sheet='pagar';ui.form={id:id,k:b.getAttribute('data-k')||ui.mes};renderSheet();break;
    case 'despagar':var mt=mesT(ui.mes);delete mt.pagados[id];save();render();break;
    case 'editNeta':ui.sheet='neta';renderSheet();break;
    case 'editCapital':ui.sheet='capital';renderSheet();break;
    case 'guardarDia':addAhorro('diario',num(S.ahorro.diario));render();toast('¡Guardado! Alcancía: '+bs(alcancia()));break;
    case 'feriado':var hy=today();if(S.ahorro.feriados[hy])delete S.ahorro.feriados[hy];else S.ahorro.feriados[hy]=true;save();render();break;
    case 'guardarSob':addAhorro('sobrante',num(b.getAttribute('data-m')),{ref:addDays(today(),-1)});render();toast('Sobrante guardado');break;
    case 'guardarRed':addAhorro('redondeo',num(b.getAttribute('data-m')));render();toast('Redondeo guardado');break;
    case 'nuevodeseo':ui.form={};ui.sheet='deseo';renderSheet();break;
    case 'comprar':var dz=find(S.deseos,id);if(dz){dz.estado='comprado';S.gastos.push({id:uid(),d:today(),m:num(dz.p),c:'Compras',n:dz.n});save();render();toast('Anotado como gasto');}break;
    case 'descartar':var dx=find(S.deseos,id);if(dx){dx.estado='descartado';save();render();toast('¡Te ahorraste '+bs(num(dx.p))+'!');}break;
    case 'nuevameta':ui.sheet='meta';renderSheet();break;
    case 'abonar':ui.sheet='abonar';ui.form={meta:id};renderSheet();break;
    case 'delmeta':if(ui.confirm===id){S.metas=S.metas.filter(function(m){return m.id!==id;});ui.confirm=null;save();}else ui.confirm=id;render();break;
    case 'addFijo':leerFijos();S.tienda.fijos.push({id:uid(),n:'',m:0,cur:'Bs',dia:1});render();break;
    case 'rmFijo':leerFijos();S.tienda.fijos.splice(+b.getAttribute('data-i'),1);render();break;
    case 'guardarAj':
      var sv=num(document.getElementById('f-sueldo').value);if(sv<=0){toast('Pon un sueldo válido');break;}
      S.sueldo=sv;S.umbral=num(document.getElementById('f-umbral').value)||50;
      S.ahorro.diario=num(document.getElementById('f-diario').value);S.ahorro.redondeo=document.getElementById('f-red').checked;
      leerFijos();S.tienda.fijos=S.tienda.fijos.filter(function(x){return String(x.n).trim();});
      S.tienda.split={emergencia:num(document.getElementById('f-pe').value),reinversion:num(document.getElementById('f-pr').value),capital:num(document.getElementById('f-pc').value)};
      save();render();toast('Ajustes guardados');break;
    case 'filtroD':ui.fd=b.getAttribute('data-f');render();break;
    case 'nuevoD':ui.sheet='deudor';ui.form={tipo:'prestamo',forma:'cualquiera',conFecha:false};renderSheet();break;
    case 'editD':var de=find(S.deudores,id);ui.sheet='deudor';ui.form={edit:id,tipo:de.tipo,n:de.n,tel:de.tel,motivo:de.motivo,monto:de.monto,conFecha:!!de.vence,vence:de.vence,forma:de.forma,nota:de.nota};renderSheet();break;
    case 'tipoD':leerDeudor();ui.form.tipo=b.getAttribute('data-t');renderSheet();break;
    case 'formaD':leerDeudor();ui.form.forma=b.getAttribute('data-f');renderSheet();break;
    case 'conFecha':leerDeudor();ui.form.conFecha=document.getElementById('dd-cf').checked;renderSheet();break;
    case 'cobrar':ui.sheet='cobro';ui.form={id:id,todo:b.getAttribute('data-todo')==='1'};renderSheet();break;
    case 'viaD':var cm=document.getElementById('co-m');ui.form.val=cm?cm.value:'';ui.form.via=b.getAttribute('data-v');renderSheet();if(ui.form.val&&!ui.form.todo)document.getElementById('co-m').value=ui.form.val;break;
    case 'verD':ui.openD=ui.openD===id?null:id;render();break;
    case 'delD':if(ui.confirm===id){S.deudores=S.deudores.filter(function(x){return x.id!==id;});ui.confirm=null;save();}else ui.confirm=id;render();break;
    case 'delPago':var pid=b.getAttribute('data-p');if(ui.confirm===pid){var dp=find(S.deudores,id);dp.pagos=dp.pagos.filter(function(p){return p.id!==pid;});ui.confirm=null;save();}else ui.confirm=pid;render();break;
    case 'exportar':var blob=new Blob([JSON.stringify(S)],{type:'application/json'}),u=URL.createObjectURL(blob),l=document.createElement('a');l.href=u;l.download='finanzas-elite-'+today()+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(function(){URL.revokeObjectURL(u);},1000);break;
    case 'reset':if(ui.confirm==='reset'){var keep={sueldo:S.sueldo,umbral:S.umbral};S={v:2,sueldo:keep.sueldo,umbral:keep.umbral,gastos:[],deseos:[],metas:[]};ensure();ui.confirm=null;save();toast('Datos borrados');}else ui.confirm='reset';render();break;
  }
});
document.addEventListener('submit',function(ev){
  ev.preventDefault();var id=ev.target.id,v;
  if(id==='form-deudor'){leerDeudor();var F=ui.form,mv=num(F.monto);if(!F.n||mv<=0){toast('Pon nombre y monto');return;}
    var obj=F.edit?find(S.deudores,F.edit):{id:uid(),d:today(),pagos:[]};
    obj.n=F.n;obj.tel=F.tel;obj.tipo=F.tipo;obj.motivo=F.motivo;obj.monto=mv;obj.vence=F.conFecha?(F.vence||null):null;obj.forma=F.forma;obj.nota=F.nota;
    if(!F.edit)S.deudores.push(obj);save();ui.sheet=null;render();toast(F.edit?'Guardado':obj.n+' te debe '+bs(mv));}
  if(id==='form-cobro'){var dc=find(S.deudores,ui.form.id),mc=Math.min(num(document.getElementById('co-m').value),saldoD(dc));if(mc<=0)return;var via=ui.form.via||(dc.forma==='qr'?'qr':'efectivo');
    dc.pagos=dc.pagos||[];dc.pagos.push({id:uid(),d:today(),m:mc,via:via});save();ui.sheet=null;render();
    toast(saldoD(dc)<=0?'¡'+dc.n+' te pagó todo! ('+(via==='qr'?'QR':'efectivo')+')':'Abono de '+bs(mc)+' por '+(via==='qr'?'QR':'efectivo')+'. Falta '+bs(saldoD(dc)));}
  if(id==='form-pagar'){v=num(document.getElementById('p-m').value);var fj=find(S.tienda.fijos,ui.form.id);if(v>0&&fj){mesT(ui.form.k).pagados[fj.id]={bs:v,d:today()};if(fj.cur==='USD'&&num(fj.m)>0){fj.tc=v/num(fj.m);S.tienda.tc=fj.tc;}
    var ck=today().slice(0,7);S.checks[ck]=S.checks[ck]||{};if(/claude/i.test(fj.n))S.checks[ck].claude=true;if(/railway/i.test(fj.n))S.checks[ck].railway=true;save();ui.sheet=null;render();toast(fj.n+' pagado: '+bs(v));}}
  if(id==='form-neta'){var raw=document.getElementById('n-m').value.trim(),mt=mesT(ui.mes);mt.neta=raw===''?null:num(raw);mt.incluye=document.getElementById('n-inc').checked;S.checks[today().slice(0,7)]=S.checks[today().slice(0,7)]||{};S.checks[today().slice(0,7)].ganancia=true;save();ui.sheet=null;render();toast('Ganancia guardada');}
  if(id==='form-capital'){S.tienda.capital=num(document.getElementById('c-m').value);save();ui.sheet=null;render();toast('Capital actualizado');}
  if(id==='form-deseo'){v=num(document.getElementById('d-p').value);if(v<=0)return;S.deseos.push({id:uid(),n:document.getElementById('d-n').value.trim(),p:v,t:Date.now(),estado:'pendiente'});save();ui.sheet=null;ui.tab='ahorro';render();toast('Anotado. Decide mañana.');}
  if(id==='form-meta'){var o=num(document.getElementById('m-o').value);if(o<=0)return;var meta={id:uid(),n:document.getElementById('m-n').value.trim(),obj:o,f:document.getElementById('m-f').value,ah:0,img:''},file=document.getElementById('m-i').files[0];var fin=function(){S.metas.push(meta);save();ui.sheet=null;render();toast('Meta creada');};if(file)resizeImage(file,function(u){meta.img=u;fin();});else fin();}
  if(id==='form-abono'){v=num(document.getElementById('a-m').value);var mt2=find(S.metas,ui.form.meta);if(mt2&&v>0){mt2.ah=num(mt2.ah)+v;if(document.getElementById('a-al').checked)addAhorro('meta',-v,{nota:mt2.n});save();}ui.sheet=null;render();toast('Abonado');}
});
document.addEventListener('change',function(ev){
  var ck=ev.target.getAttribute&&ev.target.getAttribute('data-check');
  if(ck){var k=today().slice(0,7);S.checks[k]=S.checks[k]||{};S.checks[k][ck]=ev.target.checked;save();render();return;}
  if(ev.target.id==='f-import'){var file=ev.target.files[0];if(!file)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(!d||!d.v||!Array.isArray(d.gastos))throw 0;S=d;ensure();save();render();toast('Copia restaurada');}catch(e){toast('Ese archivo no es una copia válida');}};r.readAsText(file);}
});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&!ui.sheet)render();});
save();render();
})();
</script>
